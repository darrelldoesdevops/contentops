name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: contentops

permissions:
  contents: write

jobs:
  build-arm64:
    name: Build ARM64 macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target aarch64-apple-darwin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: contentops-aarch64-apple-darwin
          path: target/aarch64-apple-darwin/release/contentops

  build-x86_64:
    name: Build x86_64 macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target x86_64-apple-darwin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: contentops-x86_64-apple-darwin
          path: target/x86_64-apple-darwin/release/contentops

  build-linux:
    name: Build x86_64 Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: contentops-x86_64-unknown-linux-gnu
          path: target/x86_64-unknown-linux-gnu/release/contentops

  build-windows:
    name: Build x86_64 Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: contentops-x86_64-pc-windows-msvc
          path: target/x86_64-pc-windows-msvc/release/contentops.exe

  release:
    name: Create Release
    needs: [build-arm64, build-x86_64, build-linux, build-windows]
    runs-on: macos-latest
    steps:
      - name: Download ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: contentops-aarch64-apple-darwin
          path: arm64

      - name: Download x86_64 binary
        uses: actions/download-artifact@v4
        with:
          name: contentops-x86_64-apple-darwin
          path: x86_64

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: contentops-x86_64-unknown-linux-gnu
          path: linux

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: contentops-x86_64-pc-windows-msvc
          path: windows

      - name: Prepare binaries
        run: |
          chmod +x arm64/contentops x86_64/contentops linux/contentops
          mv arm64/contentops contentops-aarch64-apple-darwin
          mv x86_64/contentops contentops-x86_64-apple-darwin
          mv linux/contentops contentops-x86_64-unknown-linux-gnu
          mv windows/contentops.exe contentops-x86_64-pc-windows-msvc.exe

      - name: Create universal binary
        run: lipo -create -output contentops-universal-apple-darwin contentops-aarch64-apple-darwin contentops-x86_64-apple-darwin

      - name: Generate checksums
        run: |
          shasum -a 256 contentops-aarch64-apple-darwin > contentops-aarch64-apple-darwin.sha256
          shasum -a 256 contentops-x86_64-apple-darwin > contentops-x86_64-apple-darwin.sha256
          shasum -a 256 contentops-universal-apple-darwin > contentops-universal-apple-darwin.sha256
          shasum -a 256 contentops-x86_64-unknown-linux-gnu > contentops-x86_64-unknown-linux-gnu.sha256
          shasum -a 256 contentops-x86_64-pc-windows-msvc.exe > contentops-x86_64-pc-windows-msvc.exe.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            contentops-aarch64-apple-darwin
            contentops-aarch64-apple-darwin.sha256
            contentops-x86_64-apple-darwin
            contentops-x86_64-apple-darwin.sha256
            contentops-universal-apple-darwin
            contentops-universal-apple-darwin.sha256
            contentops-x86_64-unknown-linux-gnu
            contentops-x86_64-unknown-linux-gnu.sha256
            contentops-x86_64-pc-windows-msvc.exe
            contentops-x86_64-pc-windows-msvc.exe.sha256

  update-tap:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger tap update
        run: |
          gh workflow run update-tap.yml \
            -f version="${GITHUB_REF_NAME#v}" \
            -R darrelldoesdevops/homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.TAP_UPDATE_TOKEN }}
